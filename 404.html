<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark" data-lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>404 — Only</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Cairo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<link rel="stylesheet" href="css/errors.css">
</head>
<body>
<div class="err-page">
  <div class="err-page__toggles">
    <button class="lang-toggle" id="langToggle" type="button"><span data-i18n="lang_label">EN</span></button>
    <button id="themeToggle" class="theme-toggle" type="button">
      <span class="theme-toggle-track"><span class="theme-toggle-thumb">
        <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      </span></span>
    </button>
  </div>
  <p class="err-page__logo">Only<span class="logo-dot">.</span></p>
  <p class="err-page__code">404</p>
  <div class="err-page__divider"></div>
  <p class="err-page__text">هذه الصفحة غير موجودة أو ربما تم نقلها إلى مكان آخر.</p>
  <div class="err-page__actions">
    <a href="/" class="btn btn-primary">الرئيسية</a>
    <a href="/#contact" class="btn btn-ghost">تواصل معي</a>
  </div>
</div>
<script src="js/script.js" defer></script>
</body>
</html>
