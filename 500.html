<!DOCTYPE html>
<html lang="ar" dir="rtl" data-theme="dark" data-lang="ar">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>500 — Only</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600;700&family=Cairo:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
<style>
  .err-page{
    min-height: 100svh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    text-align: center;
    padding: 40px 8vw;
    gap: 20px;
  }
  .err-page__logo{
    font-family: var(--font-display);
    font-weight: 800;
    font-size: 1.2rem;
    color: var(--text-muted);
    opacity: 0;
    animation: rise .6s var(--ease) .05s forwards;
  }
  .err-page__logo .logo-dot{ color: var(--accent-1); }
  .err-page__code{
    font-family: var(--font-display);
    font-weight: 800;
    font-size: clamp(7rem, 20vw, 16rem);
    line-height: 1;
    background: var(--accent-grad);
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    opacity: 0;
    animation: rise .7s var(--ease) .15s forwards;
  }
  .err-page__divider{
    width: 60px; height: 3px;
    border-radius: 999px;
    background: var(--accent-grad);
    opacity: 0;
    animation: rise .6s var(--ease) .25s forwards;
  }
  .err-page__text{
    font-size: clamp(1rem, 2vw, 1.2rem);
    color: var(--text-muted);
    max-width: 34ch;
    line-height: 1.7;
    margin: 0;
    opacity: 0;
    animation: rise .6s var(--ease) .35s forwards;
  }
  .err-page__actions{
    display: flex;
    gap: 14px;
    flex-wrap: wrap;
    margin-top: 8px;
    opacity: 0;
    animation: rise .6s var(--ease) .5s forwards;
  }
  .err-page__toggles{
    position: fixed;
    top: 24px;
    left: 24px;
    display: flex;
    gap: 8px;
    opacity: 0;
    animation: rise .5s var(--ease) .7s forwards;
  }
  [dir="rtl"] .err-page__toggles{ left: auto; right: 24px; }
</style>
</head>
<body>
<div class="err-page">
  <div class="err-page__toggles">
    <button class="lang-toggle" id="langToggle" type="button"><span data-i18n="lang_label">EN</span></button>
    <button id="themeToggle" class="theme-toggle" type="button">
      <span class="theme-toggle-track"><span class="theme-toggle-thumb">
        <svg class="icon icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
        <svg class="icon icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 12.8A9 9 0 1 1 11.2 3a7 7 0 0 0 9.8 9.8Z"/></svg>
      </span></span>
    </button>
  </div>
  <p class="err-page__logo">Only<span class="logo-dot">.</span></p>
  <p class="err-page__code">500</p>
  <div class="err-page__divider"></div>
  <p class="err-page__text">خطأ داخلي في السيرفر. نعمل على إصلاح المشكلة.</p>
  <div class="err-page__actions">
    <a href="/home" class="btn btn-primary">الرئيسية</a>
    <a href="/contact" class="btn btn-ghost">تواصل معي</a>
  </div>
</div>
<script src="js/script.js" defer></script>
</body>
</html>
